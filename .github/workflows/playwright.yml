name: Playwright Tests

on:
  push:
    branches: [ main, master, update-dashboard-maps ]
  pull_request:
    branches: [ main, master, update-dashboard-maps ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    # We need a database for E2E tests
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: rabelle_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Setup Database
      run: |
        npx prisma generate
        npx prisma db push
      env:
        DATABASE_URL: "mysql://root:password@127.0.0.1:3306/rabelle_test"
        
    - name: Seed Database
      run: npx prisma db seed
      env:
        DATABASE_URL: "mysql://root:password@127.0.0.1:3306/rabelle_test"
        
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
      
    - name: Create Test Environment File
      run: |
        echo 'DATABASE_URL="mysql://root:password@127.0.0.1:3306/rabelle_test"' > .env.test
        echo 'NEXTAUTH_SECRET="test-secret-do-not-use-in-prod"' >> .env.test
        echo 'NEXTAUTH_URL="http://localhost:3000"' >> .env.test
      
    - name: Run Playwright tests
      run: npx dotenv -e .env.test -- npx playwright test
      env:
        CI: true
        
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
